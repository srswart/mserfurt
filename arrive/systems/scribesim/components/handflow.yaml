component:
  id: handflow
  name: "Corridor-Following Hand Controller"
  type: library
  owners:
    - team: shawn
  stage: incubating

selectors:
  paths:
    - "scribesim/handflow/**"
    - "tests/test_gesture_action_bridge.py"
    - "tests/test_handflow_reentry.py"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/motion/**"
  build_modules: []
  tags: []
  contracts: []

interfaces:
  - "TrackPlan API (desired position, desired velocity, desired contact, desired pressure)"
  - "HandState v2 API (continuous state carried across stroke, glyph, word, line)"
  - "Opt-in event-time-v1/v2 execution with exact contact times; v2 uses an acceleration-limited velocity servo without corridor projection. Legacy execution remains default."
  - "Opt-in braked-air-v1 plan retiming with source-owner mapping, prescribed pen-up braking/rest arrival and analytic contact clock; fixed-tool scope only."
  - "Profile activation matrix for reviewed guided rendering (which HandProfile fields materially affect handflow output)"
  - "Planned realized orientation and active-edge state under bounded gesture action tracking"

invariants:
  - "The controller follows planned state, not raw keypoints, when plan tracking is enabled."
  - "Pen lifts are explicit state transitions; joins are modeled as planned contact or planned air motion."
  - "Out-of-corridor motion triggers correction or validation failure before page rendering."
  - "Timing, image or arrival success cannot override a failed actual-contact corridor gate; full foundation motion remains blocked at sharp contact corners."
  - "A profile field is not considered a tuning knob for TD-014 until the reviewed guided path measurably responds to it."
