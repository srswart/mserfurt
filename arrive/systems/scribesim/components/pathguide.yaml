component:
  id: pathguide
  name: "Dense Path Guide Model"
  type: library
  owners:
    - team: shawn
  stage: incubating

selectors:
  paths:
    - "scribesim/pathguide/**"
    - "shared/hands/pathguides/**"
    - "tests/test_gesture_action_bridge.py"
    - "tests/test_connected_gestures.py"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/action_bridge/**"
  build_modules: []
  tags: []
  contracts: []

interfaces:
  - "Connected-v1 action execution uses the source-derivative corner clock and event-time-v2 controller; contact-run/gesture ownership and realized corner contact are audited separately from shape acceptance"
  - "DensePathGuide schema (centerline, corridor, contact schedule, nominal speed/pressure)"
  - "Import/export interfaces from extracted guides and trace datasets"
  - "Planned versioned gesture action guides with explicit desired versus realized contact ownership"

invariants:
  - "Every guide must define entry/exit tangents and a finite x_advance."
  - "Every contact segment must stay inside its corridor envelope."
  - "Guide samples must be dense enough that adjacent on-surface samples are at most 0.25mm apart."
