interfaces:
  - "Planned stroke-context contract (Addendum D): immutable canonical entry/body/exit spans, previous/following port-state selectors and explicit cross-letter join/retrace/lift ownership with exact context-off behavior; not implemented or admitted by planning."
  - "letter-context-bounded-geometry-v1 derives occurrence cubics and normalized ports with independent width/advance controls and preserved canonical ownership; new geometry reaches planning only after derivation verification, never through legacy nonempty rules."
  - "letter-context-null-v1 is an opt-in six-cell following-entry identity contract with canonical and execution primitive/gesture/action/recipe lineage outside frozen owner metadata; nonidentity geometry and advances fail closed."
  - "Opt-in connected-v1 fixed-tool i/n/u/m contract: explicit smooth/corner/lift connections, six expanded references, separate contact-run and gesture ownership, truthful tangent ports and conservative finite-width/retracing overlap declarations; no learned-geometry admission"
  - "Versioned StrokeGesture/PenActionProfile schema, compiler and explicit v1 migration"
  - "Opt-in foundation gesture/lowered-language v1: two untrained return families with fixed port rays, bounded handle freedoms and six expanded primitive occurrences per recipe; legacy cap stays four."
  - "Frozen eight-hypothesis/twelve-character audit, exact expansion/attachment tables, independent target/split specifications and explicit unsupported inventory."
  - "Primitive, gesture, profile, letter, word and line occurrence lineage"

invariants:
  - "Planned contextual edits keep body geometry fixed by default, distinguish pen-down upward motion from lifts and reject unsupported transitions or word-specific residuals; any exceptions require prospective approval."
  - "Continuous contact is independent of primitive segmentation; lifts and overlap contributors are explicit."
  - "Shared identities invalidate dependent caches; no per-letter residual geometry or recursive expansion bypass."
  - "Required unsupported actions fail explicitly; frozen v1 behavior is never silently reinterpreted."
  - "This component owns representation, not training, physical footprint mechanics or gate acceptance."
  - "The original six primitives remain immutable under the foundation contract; unsupported loops, opposite bowls and unresolved letters cannot be admitted through aliases."
  - "Compiler/contract identity changes require fresh motion/baseline validation before fitting; nominal audit success is not learned or actual-motion acceptance."
