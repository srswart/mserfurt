component:
  id: gesture
  name: "Shared Stroke Gesture and Action Contract"
  type: data-contract
  owners:
    - team: shawn
  stage: incubating

selectors:
  paths:
    - "scribesim/evofit/stroke_language.py"
    - "scribesim/evofit/stroke_gestures.py"
    - "scribesim/evofit/foundation_contract.py"
    - "tests/test_stroke_language.py"
    - "tests/test_stroke_gestures.py"
    - "tests/test_foundation_contract.py"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/language/**"
    - "docs/tech-direction/TD-018-addendum-a-stroke-gestures.md"
    - "docs/tech-direction/TD-018-addendum-b-foundation-repair.md"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/contract/**"
  build_modules: []
  tags: []
  contracts: []

interfaces:
  - "Planned versioned StrokeGesture/PenActionProfile schema, compiler and explicit v1 migration"
  - "Primitive, gesture, profile, letter, word and line occurrence lineage"

invariants:
  - "Continuous contact is independent of primitive segmentation; lifts and overlap contributors are explicit."
  - "Shared identities invalidate dependent caches; no per-letter residual geometry or recursive expansion bypass."
  - "Required unsupported actions fail explicitly; frozen v1 behavior is never silently reinterpreted."
  - "This component owns representation, not training, physical footprint mechanics or gate acceptance."
