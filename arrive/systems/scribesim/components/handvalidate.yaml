component:
  id: handvalidate
  name: "Hand Model Validation and Measurement"
  type: library
  owners:
    - team: shawn
  stage: incubating

selectors:
  paths:
    - "scribesim/handvalidate/**"
    - "tests/test_handvalidate*.py"
    - "shared/training/konrad_hand_recovery/**"
  build_modules: []
  tags: []
  contracts: []

interfaces:
  - "Metrics API for corridor containment, path self-intersection, DTW, width profile error, OCR/recognition score"
  - "Gate evaluator for stop/go promotion across curriculum levels"
  - "Independent primitive S1 readers require pinned reports, current identities, fresh baseline, full-frame transfer, all-cubic subdivision and adversarial owner/contact gates. Failed legacy HANDVALIDATE-015 evidence stays rejected; tangent_evaluation.require_readiness admits matched run-002 only for curve-tangent-v1 fixed-tool shared gestures."
  - "Parameter sensitivity bench for reviewed guided proofs"
  - "foundation_gestures.require_readiness verifies a consumer-pinned independent foundation manifest, current primitive/gesture/tool/code identities, fresh baseline, per-contact boundaries, all-seed replay and retained budgets; only the three declared shared constructions can scope a new action/null experiment."
  - "Explicit pen-action foundation admission never enables the legacy action fitter or promotes a constant profile as an accepted null action. CURRICULUM-012 and HANDVALIDATE-017 must provide new selected-action/null evidence before letter readiness."
  - "foundation_actions.require_readiness reconstructs consumer-pinned independent fixed-null proofs for explicitly requested synthetic gestures and legacy-full-edge only. Six selected-path adversarial classes, closed diagnostic counters, exact lineage and all-seed replay are mandatory; unresolved coverage and cross-tool requests fail closed, and letter/real approval remains separate."
  - "finer_scales.require_readiness independently reconstructs pinned CURRICULUM-013 selection/lineage and fresh all-seed fixed-null measurements for its replacement candidate bytes. It retains old candidate-specific validators, requires explicit gesture/tool scope and unchanged absolute/local/mechanical bounds, and never grants letter or real-hand approval."

invariants:
  - "Every metric used as a gate must be deterministic for fixed inputs."
  - "A promoted checkpoint must satisfy all required gates, not only an aggregate score."
  - "Folio rollout remains opt-in until word-, line-, and folio-level gates pass."
  - "A handflow profile parameter must show measurable output sensitivity before it is treated as an active tuning control."
