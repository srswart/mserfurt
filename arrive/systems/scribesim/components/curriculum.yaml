component:
  id: curriculum
  name: "Hand Training Curriculum"
  type: library
  owners:
    - team: shawn
  stage: incubating

selectors:
  paths:
    - "scribesim/curriculum/**"
    - "shared/training/handsim/**"
    - "tests/test_gesture_coverage.py"
    - "tests/test_gesture_learning.py"
    - "tests/test_pen_action_learning.py"
    - "tests/test_foundation_primitives.py"
    - "tests/test_foundation_measurement.py"
    - "tests/test_foundation_gestures.py"
    - "tests/test_foundation_actions.py"
    - "tests/test_finer_scales.py"
    - "tests/test_letter_recipes.py"
    - "tests/test_letter_recipe_evidence.py"
    - "tests/test_letter_alignment.py"
    - "tests/test_upright_letters.py"
    - "tests/test_letter_alignment_evidence.py"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/letters/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/finer_scales/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/coverage/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/gestures/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/actions/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/primitives/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/gestures/**"
    - "shared/training/konrad_hand_recovery/stroke_gestures_v2/foundation_repair/actions/**"
  build_modules: []
  tags: []
  contracts: []

interfaces:
  - "Deterministic connected-v1 shared upright n/u/m nominal preview, pinned unaccepted source bytes, unchanged stem cubics, truthful ports, level 4/4/6-reference recipes, same-scale ink/ownership review artifacts and no fitting or physical acceptance before owner review"
  - "Exact baseline/x-height-compatible whole-gesture assembly with separately versioned independent targets, scoped standalone-stem consumption, immutable numeric adjudication and no S2/context promotion"
  - "Bounded opt-in n/u/m letter recipes over pinned finer-scale strokes, with live scoped admission, explicit unresolved stem debt, development-only placement selection, local/physical/attachment proofs and synthetic-only replay evidence"
  - "Curriculum stages for primitive, glyph, word, line, and folio training"
  - "Training-set manifests with acceptance gates and evidence outputs"
  - "Planned fixed-tool gesture learning and isolated intentional-action ablations"
  - "Versioned admitted-input lower/upper-return handle fitting, development selection, held-out attachment proofs and immutable budgeted attempts"
  - "Pinned no-refit full-frame measurement of saved candidates and trajectories, with fail-closed footprint and region containment"
  - "Admitted fixed-tool shared gesture attachment learning with independent analytic targets, lifted-pair holdouts, immutable attempts and cap-preserving source-subdivision proofs"
  - "Approved no-refit gesture remeasurement and remaining-seed continuation, preserving diagnostic pen lifts and cumulative interrupted-run budgets"
  - "Bounded predeclared fixed-tool null experiments with independent absolute target/local quality, preserved candidate bytes, exact contact/tool controls, fresh-process replay and selected-evidence handoff without S1-action admission"

invariants:
  - "A stage cannot advance until its validation gate passes."
  - "Every training run writes structured metrics and snapshots for regression."
  - "Later stages must consume frozen checkpoints from the previous stage."
  - "Return learning preserves old-six geometry, ports, tool and supplied scaffolds; incomplete or cropped evidence cannot grant S1 or gesture-fitting permission."
  - "Gesture learning freezes every primitive and action; only shared audited attachment transforms change, and independent HANDVALIDATE-016 remains required for S1-gesture."
  - "Diagnostic trajectories preserve all contact points and explicit inter-gesture lifts; frozen-candidate continuation cannot invoke selection or change target/search/criterion definitions."
