<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="Two untrained return primitives with fixed entry and exit tangents and control handles">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287b68"/></marker></defs>
<rect width="1000" height="350" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#24342f" font-size="16">
<text x="30" y="30">Fixed ports, bounded handle lengths — initial geometry, NOT learned strokes</text>
<text x="30" y="327">Green arrows: pen direction. Gray: control handles. Coordinates use x-height units; no target or actual-motion rendering.</text></g><text x="60" y="65" font-family="system-ui" font-size="20">lower-return</text>
 <path d="M60.000,185.000 L66.218,268.942 M308.798,265.004 L360.000,185.000" fill="none" stroke="#aaa" stroke-width="2"/>
